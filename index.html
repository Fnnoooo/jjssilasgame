<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Jujutsu Shenanigans - Yuji (Beach Island Edition)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- Tone.js for Real-Time Procedural Sound Design -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <!-- Anime Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Black+Ops+One&family=Rajdhani:wght@600;700;900&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      font-family: 'Rajdhani', sans-serif;
      background: #7ec0ee;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .combat-font {
      font-family: 'Bangers', cursive;
      letter-spacing: 1px;
    }
    .jjs-font {
      font-family: 'Black Ops One', cursive;
    }
    .impact-invert {
      filter: invert(1) contrast(4) saturate(0) brightness(1.2) !important;
    }
    .impact-crimson {
      filter: contrast(3) saturate(2.5) hue-rotate(330deg) !important;
    }
    .black-flash-vignette {
      background: radial-gradient(circle, transparent 30%, rgba(185, 28, 28, 0.4) 65%, rgba(0, 0, 0, 0.98) 100%);
    }
    .awakened-vignette {
      background: radial-gradient(circle, transparent 35%, rgba(220, 38, 38, 0.5) 70%, rgba(10, 0, 3, 0.98) 100%);
    }
    @keyframes pulse-ready {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 14px rgba(245, 158, 11, 0.8), inset 0 0 8px rgba(245, 158, 11, 0.4);
      }
      50% {
        transform: scale(1.06);
        box-shadow: 0 0 24px rgba(239, 68, 68, 1), inset 0 0 14px rgba(239, 68, 68, 0.7);
      }
    }
    .ult-ready-anim {
      animation: pulse-ready 0.85s infinite ease-in-out;
      border-color: #f59e0b !important;
    }
    @keyframes pulse-active {
      0%, 100% { box-shadow: 0 0 16px #dc2626; }
      50% { box-shadow: 0 0 30px #ff003b; }
    }
    .ult-active-anim {
      animation: pulse-active 0.65s infinite alternate ease-in-out;
      border-color: #ef4444 !important;
    }

    body.shift-lock-cursor-hidden,
    body.shift-lock-cursor-hidden * {
      cursor: none !important;
    }

    .shift-lock-crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18px;
      height: 18px;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: all 0.15s ease-out;
    }
    .shift-lock-active {
      width: 22px;
      height: 22px;
    }
    .shift-lock-active .reticle-dot {
      background-color: #00f0ff !important;
      box-shadow: 0 0 10px #00f0ff, 0 0 20px #00f0ff !important;
    }

    #speed-lines-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease-out;
      z-index: 25;
    }

    .cinematic-bar-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 0;
      background: #000000;
      z-index: 45;
      transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .cinematic-bar-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0;
      background: #000000;
      z-index: 45;
      transition: height 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }
    .cinematic-active .cinematic-bar-top,
    .cinematic-active .cinematic-bar-bottom {
      height: 9vh;
    }
    .hud-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: scale(0.92) !important;
      transition: opacity 0.35s ease, transform 0.35s ease !important;
    }

    @media (max-height: 540px) {
      .compact-top-hud {
        transform: scale(0.72) translateX(-69%) !important;
        top: 2px !important;
      }
      .compact-hotbar {
        transform: scale(0.78) translateX(-64%) !important;
        bottom: 2px !important;
      }
      .mobile-joy-container {
        bottom: 8px !important;
        left: 8px !important;
        width: 58px !important;
        height: 58px !important;
      }
    }
  </style>
</head>
<body class="relative w-full h-full bg-[#7ec0ee] select-none overflow-hidden touch-none">
  <div id="canvas-container" class="absolute inset-0 z-0 touch-none"></div>

  <canvas id="speed-lines-canvas"></canvas>
  <div id="impact-overlay" class="absolute inset-0 pointer-events-none z-30 opacity-0 transition-opacity duration-75"></div>
  <div id="zone-overlay" class="absolute inset-0 pointer-events-none z-20 opacity-0 transition-opacity duration-300 black-flash-vignette"></div>

  <div id="cinematic-top" class="cinematic-bar-top"></div>
  <div id="cinematic-bottom" class="cinematic-bar-bottom"></div>

  <div id="cinematic-title-box" class="absolute inset-0 z-50 pointer-events-none flex flex-col items-center justify-center opacity-0 transition-opacity duration-400">
    <span class="combat-font text-red-500 text-xs sm:text-base tracking-[0.4em] uppercase font-bold animate-pulse drop-shadow-[0_0_12px_#ef4444]">THE ESSENCE OF CURSED ENERGY</span>
    <h1 id="cinematic-sub-text" class="jjs-font text-2xl sm:text-4xl font-black text-white tracking-widest uppercase drop-shadow-[0_0_28px_#dc2626] mt-1 text-center">SPATIAL HARMONY</h1>
    <span class="text-gray-300 text-[10px] tracking-widest uppercase mt-1">DRAG SCREEN TO ORBIT CAMERA FREELY</span>
    <div class="w-32 h-0.5 bg-gradient-to-r from-transparent via-red-500 to-transparent mt-2"></div>
  </div>

  <div id="crosshair-el" class="shift-lock-crosshair z-20 flex items-center justify-center pointer-events-none">
    <div id="reticle-dot" class="reticle-dot w-2 h-2 bg-red-500 rounded-full shadow-[0_0_8px_#ef4444] transition-all"></div>
    <div id="reticle-bracket-l" class="hidden absolute -left-2.5 w-1 h-3 border-l-2 border-cyan-400"></div>
    <div id="reticle-bracket-r" class="hidden absolute -right-2.5 w-1 h-3 border-r-2 border-cyan-400"></div>
  </div>

  <div id="game-hud-wrapper" class="absolute inset-0 pointer-events-none z-20 transition-all duration-300">
    <div class="compact-top-hud absolute top-2 left-1/2 -translate-x-1/2 z-20 w-[92vw] max-w-sm flex flex-col gap-1 pointer-events-none scale-85 sm:scale-95 origin-top transition-transform">
      <!-- Player HP Bar -->
      <div class="bg-gray-950/85 backdrop-blur-md px-2.5 py-1.5 rounded-lg border border-red-900/40 shadow-xl flex flex-col gap-1">
        <div class="flex justify-between items-center text-[10px] font-bold text-gray-200 leading-none">
          <div class="flex items-center gap-1.5">
            <span class="jjs-font text-red-400 text-[11px] tracking-wider">YUJI ITADORI</span>
            <span id="player-state-text" class="text-[8px] text-gray-400 font-bold">READY</span>
            <span id="zone-badge" class="hidden text-[7px] bg-red-600 text-white font-black px-1.5 py-0.5 rounded shadow-[0_0_8px_#ef4444] tracking-wider">120% AWAKENED</span>
          </div>
          <span id="player-hp-num" class="text-red-400 font-mono text-[9px] font-bold">100 / 100</span>
        </div>
        <div class="w-full bg-gray-900 h-1.5 rounded-full overflow-hidden border border-red-950">
          <div id="player-hp-bar" class="h-full bg-gradient-to-r from-red-600 via-rose-500 to-amber-500 rounded-full transition-all duration-150 w-full shadow-[0_0_8px_#ef4444]"></div>
        </div>
      </div>

      <!-- Enemy HP Bar -->
      <div id="enemy-card" class="bg-gray-950/85 backdrop-blur-md px-2.5 py-1.5 rounded-lg border border-purple-900/40 shadow-xl flex flex-col gap-1">
        <div class="flex justify-between items-center text-[10px] font-bold text-gray-200 leading-none">
          <div class="flex items-center gap-1.5">
            <span class="jjs-font text-purple-400 text-[11px] tracking-wider">MAHITO</span>
            <span id="enemy-stun-tag" class="hidden text-[7px] bg-yellow-600 text-black font-bold px-1 rounded">STUNNED</span>
            <span id="enemy-ragdoll-tag" class="hidden text-[7px] bg-blue-600 text-white font-bold px-1 rounded">DOWNED (IMMUNE)</span>
          </div>
          <span id="enemy-hp-num" class="text-purple-400 font-mono text-[9px] font-bold">100%</span>
        </div>
        <div class="w-full bg-gray-900 h-1.5 rounded-full overflow-hidden border border-purple-950">
          <div id="enemy-hp-bar" class="h-full bg-gradient-to-r from-purple-700 via-indigo-600 to-purple-400 rounded-full transition-all duration-150 w-full shadow-[0_0_6px_#9333ea]"></div>
        </div>
      </div>

      <!-- Ultimate Bar -->
      <div class="w-full flex items-center gap-1.5 text-[9px] leading-none mt-0.5 bg-gray-950/85 backdrop-blur-md px-2.5 py-1 rounded-lg border border-yellow-900/40">
        <span class="text-amber-400 font-bold uppercase text-[8px] tracking-tighter" id="ult-label">ULT</span>
        <div class="flex-1 bg-gray-900 h-2 rounded-full overflow-hidden border border-yellow-900/50 relative">
          <div id="awakening-bar" class="h-full bg-gradient-to-r from-yellow-500 via-amber-400 to-red-500 rounded-full transition-all duration-100 w-0 shadow-[0_0_8px_#f59e0b]"></div>
        </div>
        <span id="awakening-pct" class="text-yellow-400 font-mono font-bold text-[9px] min-w-[38px] text-right">0%</span>
      </div>
    </div>

    <!-- Black Flash Streak Counter & Hit Banner -->
    <div class="absolute left-2.5 top-24 z-20 pointer-events-none flex flex-col items-start gap-1 scale-80 sm:scale-95 origin-left">
      <div id="bf-chain-container" class="opacity-0 transform -translate-x-4 transition-all duration-150 flex flex-col">
        <span class="text-[8px] uppercase tracking-widest text-red-400 font-black jjs-font drop-shadow-sm">KOKUSEN</span>
        <div class="flex items-baseline gap-1">
          <span id="bf-count-num" class="combat-font text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-b from-white via-red-500 to-black drop-shadow-[0_0_16px_#ef4444]">1</span>
          <span class="jjs-font text-sm text-red-500 font-extrabold italic">SPARKS</span>
        </div>
        <div id="bf-tier-title" class="combat-font text-[10px] text-yellow-300 tracking-tight drop-shadow-md">SPATIAL DISTORTION!</div>
      </div>

      <div id="combo-hit-banner" class="opacity-0 transition-opacity duration-150 text-white font-extrabold text-[11px] combat-font tracking-wide bg-black/90 px-2 py-0.5 rounded border-l-2 border-red-500 shadow-lg mt-1">
        <span id="combo-hit-text" class="text-red-400">4-HIT STRIKE</span>
      </div>
    </div>

    <div class="compact-hotbar absolute bottom-2 left-1/2 -translate-x-1/2 z-20 flex flex-col items-center gap-1 w-full px-1 scale-90 sm:scale-100 origin-bottom pointer-events-auto transition-transform">
      <div id="chain-window-indicator" class="opacity-0 transition-opacity duration-100 flex items-center gap-1.5 bg-red-950/95 text-red-200 border border-red-500 px-3 py-0.5 rounded-full shadow-[0_0_14px_#dc2626]">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
        <span id="chain-timer-label" class="text-[8px] sm:text-[9px] font-black tracking-wider uppercase">CHAIN ACTIVE: 1.0s REMAINING</span>
      </div>

      <div class="flex items-center gap-1 bg-gray-950/90 backdrop-blur-md p-1.5 rounded-xl border border-gray-800 shadow-2xl max-w-full overflow-x-auto">
        <!-- M1 Punch -->
        <button id="btn-m1" class="relative group w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-b from-gray-800 to-gray-900 border border-red-950 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-red-600 shadow-sm shrink-0">
          <span class="text-[6px] text-gray-400 font-bold leading-none">M1</span>
          <span class="text-[10px] font-black text-gray-100 combat-font leading-none">PUNCH</span>
          <div id="m1-step-dots" class="flex gap-0.5 mt-0.5">
            <span class="w-1 h-1 rounded-full bg-red-500 shadow-[0_0_4px_#ef4444]"></span>
            <span class="w-1 h-1 rounded-full bg-gray-700"></span>
            <span class="w-1 h-1 rounded-full bg-gray-700"></span>
            <span class="w-1 h-1 rounded-full bg-gray-700"></span>
          </div>
        </button>

        <!-- Move 1: Divergent Fist (6s CD / 7 DMG) / Ult: Soul Dismantle (15 DMG) -->
        <button id="btn-skill-1" class="relative group w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-b from-gray-800 to-gray-900 border border-blue-950 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-blue-500 shadow-sm shrink-0">
          <span class="absolute top-0.5 left-1 text-[7px] font-bold text-blue-400 bg-blue-950/80 px-1 rounded leading-none">1</span>
          <span id="label-skill-1" class="text-[8px] sm:text-[9px] font-black text-blue-300 combat-font leading-tight text-center px-0.5 mt-1">DIVERGENT</span>
          <div id="cd-1" class="absolute inset-0 bg-black/85 rounded-lg flex items-center justify-center text-[10px] font-bold text-blue-300 font-mono hidden">6.0</div>
        </button>

        <!-- Move 2: Manji Kick (7s CD / 9 DMG) / Ult: Piercing Blood (15 DMG) -->
        <button id="btn-skill-2" class="relative group w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-b from-gray-800 to-gray-900 border border-orange-950 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-orange-500 shadow-sm shrink-0">
          <span class="absolute top-0.5 left-1 text-[7px] font-bold text-orange-400 bg-orange-950/80 px-1 rounded leading-none">2</span>
          <span id="label-skill-2" class="text-[8px] sm:text-[9px] font-black text-orange-300 combat-font leading-tight text-center px-0.5 mt-1">MANJI</span>
          <div id="cd-2" class="absolute inset-0 bg-black/85 rounded-lg flex items-center justify-center text-[10px] font-bold text-orange-300 font-mono hidden">7.0</div>
        </button>

        <!-- Move 3: Cursed Dropkick (11s CD / 15 DMG) / Ult: Cleave Rush (15 DMG) -->
        <button id="btn-skill-3" class="relative group w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-b from-emerald-950 via-gray-900 to-gray-950 border border-emerald-950 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-emerald-500 shadow-sm shrink-0">
          <span class="absolute top-0.5 left-1 text-[7px] font-bold text-emerald-400 bg-emerald-950/80 px-1 rounded leading-none">3</span>
          <span id="label-skill-3" class="text-[8px] sm:text-[9px] font-black text-emerald-300 combat-font leading-tight text-center px-0.5 mt-1">DROPKICK</span>
          <div id="cd-3" class="absolute inset-0 bg-black/85 rounded-lg flex items-center justify-center text-[10px] font-bold text-emerald-300 font-mono hidden">11.0</div>
        </button>

        <!-- Move 4: Black Flash (10 DMG, strict 1s chain) / Ult: 8x Barrage (4 DMG x 8) -->
        <button id="btn-skill-4" class="relative group w-10 h-10 sm:w-11 sm:h-11 rounded-lg bg-gradient-to-b from-red-950 via-gray-900 to-black border-2 border-red-500 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-red-400 shadow-[0_0_12px_#ef4444] shrink-0">
          <span class="absolute top-0.5 left-1 text-[7px] font-black text-red-300 bg-red-900 px-1 rounded leading-none">4</span>
          <span id="label-skill-4" class="text-[9px] sm:text-[10px] font-black text-white combat-font text-center leading-none tracking-tight drop-shadow-[0_0_4px_#dc2626] mt-0.5">BLACK FLASH</span>
          <span id="sub-skill-4" class="text-[6px] font-black text-red-400 uppercase tracking-tighter">1s CHAIN</span>
          <div id="cd-4" class="absolute inset-0 bg-black/85 rounded-lg flex items-center justify-center text-[10px] font-bold text-red-400 font-mono hidden">5.0</div>
        </button>

        <!-- Q: Dash -->
        <button id="btn-dash" class="relative group w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-gray-900 border border-gray-700 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-gray-400 shrink-0">
          <span class="text-[6px] text-gray-400 font-bold uppercase leading-none">Q</span>
          <span class="text-[8px] font-black text-gray-200 combat-font leading-none">DASH</span>
        </button>

        <!-- Space: Jump / Downslam Prep -->
        <button id="btn-jump" class="relative group w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-gray-900 border border-emerald-800 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-emerald-400 shrink-0">
          <span class="text-[6px] text-emerald-400 font-bold uppercase leading-none">SPC</span>
          <span class="text-[8px] font-black text-emerald-300 combat-font leading-none">JUMP</span>
        </button>

        <!-- F: Guard -->
        <button id="btn-block" class="relative group w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-gray-900 border border-blue-900 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-blue-500 shrink-0">
          <span class="text-[6px] text-blue-400 font-bold uppercase leading-none">F</span>
          <span class="text-[8px] font-black text-blue-300 combat-font leading-none">GUARD</span>
        </button>

        <!-- Shift Lock -->
        <button id="btn-shiftlock" class="relative group w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-b from-gray-900 to-gray-950 border border-cyan-800 flex flex-col items-center justify-center transition-all active:scale-90 hover:border-cyan-400 shadow-sm shrink-0">
          <span class="text-[6px] text-cyan-400 font-bold uppercase leading-none">Shift/Z</span>
          <span id="label-shiftlock" class="text-[8px] sm:text-[9px] font-black text-cyan-300 combat-font leading-tight text-center">LOCK OFF</span>
        </button>

        <!-- G: Awakening -->
        <button id="btn-awaken" class="relative group w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-gradient-to-b from-gray-900 to-black border border-gray-800 flex flex-col items-center justify-center transition-all active:scale-90 shadow-md shrink-0 opacity-40 cursor-not-allowed">
          <span class="text-[6px] text-yellow-500 font-bold uppercase leading-none">G</span>
          <span id="label-awaken" class="text-[8px] sm:text-[9px] font-black text-gray-400 combat-font text-center leading-none">LOCKED</span>
          <span id="sub-awaken" class="text-[6px] font-black text-yellow-600 uppercase">0%</span>
        </button>
      </div>
    </div>

    <!-- Top Right Utility Buttons -->
    <div class="absolute top-2 right-2 z-20 flex items-center gap-1.5 scale-85 sm:scale-95 origin-top-right pointer-events-auto">
      <button id="btn-sound" class="bg-gray-900/85 backdrop-blur-md px-2 py-1 rounded-md border border-gray-700 text-[10px] text-gray-200 font-bold hover:bg-gray-800 transition active:scale-95 shadow">
        <span id="sound-icon">🔊</span>
      </button>
      <button id="btn-dummy-mode" class="bg-purple-950/90 backdrop-blur-md px-2.5 py-1 rounded-md border border-purple-600 text-[8px] text-purple-200 font-bold hover:bg-purple-900 transition active:scale-95 shadow flex items-center gap-1">
        <span>AI:</span> <span id="dummy-mode-text" class="text-green-400 font-black">SANDBAG</span>
      </button>
      <button id="btn-reset-dummy" class="bg-red-950/85 backdrop-blur-md px-2 py-1 rounded-md border border-red-800 text-[8px] text-red-200 font-bold hover:bg-red-900 transition active:scale-95 shadow">
        Respawn
      </button>
    </div>
  </div>

  <!-- Mobile Touch Virtual Joystick -->
  <div id="mobile-controls" class="mobile-joy-container absolute bottom-4 left-4 z-30 w-16 h-16 rounded-full border border-gray-700/60 bg-black/45 touch-none flex items-center justify-center pointer-events-auto transition-transform">
    <div id="joystick-knob" class="mobile-joy-knob w-6 h-6 rounded-full bg-red-600/80 border border-red-400 shadow pointer-events-none"></div>
  </div>

  <script>
    let audioInitialized = false;
    let masterVolume = null;
    let hitSynth = null;
    let heavyImpactSynth = null;
    let blackFlashSub = null;
    let blackFlashSnap = null;
    let blackFlashDistort = null;
    let lightningNoise = null;
    let awakeningLead = null;
    let slashSynth = null;
    let cinematicDrone = null;
    let heartbeatSynth = null;

    let ostKick = null;
    let ostBass = null;
    let ostLead = null;
    let ostHihat = null;
    let ostPlaying = false;
    let ostStep = 0;
    let ostRepeatId = null;

    function initAudio() {
      if (audioInitialized) return;
      try {
        if (window.Tone) {
          Tone.start();
          masterVolume = new Tone.Volume(-2).toDestination();

          hitSynth = new Tone.MembraneSynth({
            pitchDecay: 0.05,
            octaves: 5.0,
            oscillator: { type: 'sine' },
            envelope: { attack: 0.001, decay: 0.16, sustain: 0.01, release: 0.1 }
          }).connect(masterVolume);

          heavyImpactSynth = new Tone.MembraneSynth({
            pitchDecay: 0.08,
            octaves: 7.0,
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.001, decay: 0.35, sustain: 0.02, release: 0.25 }
          }).connect(masterVolume);

          blackFlashSnap = new Tone.NoiseSynth({
            noise: { type: 'white' },
            envelope: { attack: 0.001, decay: 0.035, sustain: 0 }
          }).connect(masterVolume);

          blackFlashDistort = new Tone.Synth({
            oscillator: { type: 'sawtooth' },
            envelope: { attack: 0.001, decay: 0.28, sustain: 0.04, release: 0.22 }
          }).connect(masterVolume);

          blackFlashSub = new Tone.MonoSynth({
            oscillator: { type: 'sine' },
            envelope: { attack: 0.003, decay: 1.4, sustain: 0.2, release: 1.1 },
            filterEnvelope: { attack: 0.001, decay: 0.45, sustain: 0.15, release: 0.9, baseFrequency: 160, octaves: 4.0 }
          }).connect(masterVolume);

          lightningNoise = new Tone.NoiseSynth({
            noise: { type: 'pink' },
            envelope: { attack: 0.002, decay: 0.4, sustain: 0 }
          }).connect(masterVolume);

          slashSynth = new Tone.NoiseSynth({
            noise: { type: 'white' },
            envelope: { attack: 0.001, decay: 0.15, sustain: 0 }
          }).connect(masterVolume);

          awakeningLead = new Tone.PolySynth(Tone.Synth, {
            oscillator: { type: 'sawtooth' },
            envelope: { attack: 0.04, decay: 0.45, sustain: 0.25, release: 0.6 }
          }).connect(masterVolume);

          cinematicDrone = new Tone.MonoSynth({
            oscillator: { type: 'triangle' },
            envelope: { attack: 0.8, decay: 2.0, sustain: 0.8, release: 1.5 },
            filter: { Q: 2, type: 'lowpass', rolloff: -24 },
            filterEnvelope: { attack: 0.5, decay: 1.5, sustain: 0.6, release: 1.5, baseFrequency: 60, octaves: 2.5 }
          }).connect(masterVolume);

          heartbeatSynth = new Tone.MembraneSynth({
            pitchDecay: 0.08,
            octaves: 2.5,
            oscillator: { type: 'sine' },
            envelope: { attack: 0.001, decay: 0.35, sustain: 0, release: 0.25 }
          }).connect(masterVolume);

          ostKick = new Tone.MembraneSynth({
            pitchDecay: 0.06,
            octaves: 6,
            oscillator: { type: 'sine' },
            envelope: { attack: 0.001, decay: 0.25, sustain: 0, release: 0.2 }
          }).connect(masterVolume);

          ostBass = new Tone.MonoSynth({
            oscillator: { type: 'sawtooth' },
            filter: { Q: 3.5, type: 'lowpass', rolloff: -24 },
            envelope: { attack: 0.01, decay: 0.22, sustain: 0.45, release: 0.2 },
            filterEnvelope: { attack: 0.01, decay: 0.22, sustain: 0.2, release: 0.2, baseFrequency: 85, octaves: 3.2 }
          }).connect(masterVolume);

          ostLead = new Tone.Synth({
            oscillator: { type: 'square' },
            envelope: { attack: 0.01, decay: 0.14, sustain: 0.1, release: 0.1 }
          }).connect(masterVolume);

          ostHihat = new Tone.NoiseSynth({
            noise: { type: 'white' },
            envelope: { attack: 0.001, decay: 0.04, sustain: 0 }
          }).connect(masterVolume);

          Tone.Transport.bpm.value = 142;
          const bassNotes = ['D1', 'D1', 'F1', 'D1', 'G1', 'D1', 'A#0', 'C1'];
          const leadArp = ['D4', 'F4', 'A4', 'D5', 'C5', 'A4', 'F4', 'E4'];

          if (ostRepeatId === null) {
            ostRepeatId = Tone.Transport.scheduleRepeat((time) => {
              if (!ostPlaying) return;
              if (ostStep % 4 === 0 && ostKick) {
                ostKick.triggerAttackRelease('C1', '8n', time, 0.95);
              }
              if (ostStep % 2 === 1 && ostHihat) {
                ostHihat.triggerAttackRelease('16n', time, 0.45);
              }
              if (ostStep % 2 === 0 && ostBass) {
                const bNote = bassNotes[(ostStep / 2) % bassNotes.length];
                ostBass.triggerAttackRelease(bNote, '8n', time, 0.78);
              }
              if (ostLead) {
                const lNote = leadArp[ostStep % leadArp.length];
                ostLead.triggerAttackRelease(lNote, '16n', time, 0.32);
              }
              ostStep = (ostStep + 1) % 16;
            }, '16n');
          }

          audioInitialized = true;
        }
      } catch (err) {
        console.warn("Tone.js deferred", err);
      }
    }

    function startAwakeningOST() {
      if (!audioInitialized) initAudio();
      try {
        if (window.Tone) {
          if (Tone.context.state !== 'running') {
            Tone.context.resume();
          }
          ostStep = 0;
          ostPlaying = true;
          Tone.Transport.seconds = 0;
          Tone.Transport.start();
        }
      } catch (e) {
        console.warn("Error starting OST:", e);
      }
    }

    function stopAwakeningOST() {
      try {

        }
      } catch (e) {}

          const notes = ['D2', 'F2', 'A2', 'D3', 'F3'];
          const note = notes[Math.min(chainCount - 1, notes.length - 1)];
          blackFlashDistort.triggerAttackRelease(note, '16n', '+0.008', 0.95);
        }
        if (blackFlashSub) {
          const subNote = chainCount > 3 ? 'B-1' : (chainCount > 1 ? 'C0' : 'D0');

    function createProceduralSandTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#e8d5a7';
      ctx.fillRect(0, 0, 512, 512);

      // Fine grain noise
      for (let i = 0; i < 45000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const shade = Math.random() > 0.5 ? 245 : 205;
        const alpha = 0.07 + Math.random() * 0.12;
        ctx.fillStyle = `rgba(${shade}, ${shade - 20}, ${shade - 50}, ${alpha})`;
        ctx.fillRect(x, y, 1.5, 1.5);
      }

      // Gentle wind ripples
      ctx.strokeStyle = 'rgba(210, 185, 130, 0.22)';
      ctx.lineWidth = 3;
      for (let y = 0; y < 512; y += 18) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        for (let x = 0; x <= 512; x += 32) {
          ctx.lineTo(x, y + Math.sin(x * 0.05) * 4);
        }
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 8);
      return tex;
    }

    function createProceduralBarkTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#7a5230';
      ctx.fillRect(0, 0, 256, 256);

      // Horizontal segment rings of palm tree bark
      for (let y = 0; y < 256; y += 14) {
        ctx.fillStyle = '#55361b';
        ctx.fillRect(0, y, 256, 4);
        ctx.fillStyle = '#94663e';
        ctx.fillRect(0, y + 4, 256, 3);
      }
      for (let i = 0; i < 3000; i++) {
        const x = Math.random() * 256;
        const y = Math.random() * 256;
        ctx.fillStyle = 'rgba(40, 22, 10, 0.18)';
        ctx.fillRect(x, y, 2, 2);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 4);
      return tex;
    }

    function createProceduralPalmLeafTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#2d8028';
      ctx.fillRect(0, 0, 128, 512);

      // Center stem vein
      ctx.fillStyle = '#9fd64b';
      ctx.fillRect(60, 0, 8, 512);

      // Angled leaf blade strips
      ctx.strokeStyle = '#1b5a17';
      ctx.lineWidth = 2;
      for (let y = 0; y < 512; y += 8) {
        ctx.beginPath();
        ctx.moveTo(64, y);
        ctx.lineTo(8, y + 16);
        ctx.moveTo(64, y);
        ctx.lineTo(120, y + 16);
        ctx.stroke();
      }

      const tex = new THREE.CanvasTexture(canvas);
      return tex;
    }

    function createProceduralRockTexture() {
      const canvas = document.createElement('canvas');

      canvas.height = 256;

        ctx.fillStyle = `rgb(${c}, ${c}, ${c + 4})`;

      }
      return new THREE.CanvasTexture(canvas);

    // Heightmap function for natural dunes, hills, and shoreline slope
    function getTerrainHeight(x, z) {
      const dist = Math.hypot(x, z);
      if (dist > 42) return -4.0; // Deep water drop-off
      
      // Gentle center arena (smooth elevation near 0 for clean combat)
      let h = Math.sin(x * 0.1) * Math.cos(z * 0.1) * 0.12;

      // North-East rolling sand hill
      const dHill1 = Math.hypot(x - 17, z + 16);
      if (dHill1 < 16) {
        h += Math.cos((dHill1 / 16) * (Math.PI / 2)) * 3.4;
      }

      // South-West coastal dune ridge
      const dHill2 = Math.hypot(x + 19, z - 13);
      if (dHill2 < 15) {
        h += Math.cos((dHill2 / 15) * (Math.PI / 2)) * 2.6;
      }

      // North-West viewing mound
      const dHill3 = Math.hypot(x + 16, z + 18);
      if (dHill3 < 14) {
        h += Math.cos((dHill3 / 14) * (Math.PI / 2)) * 2.2;
      }

      // Smooth shoreline decline dipping naturally into ocean water at radius 33+
      if (dist > 28) {
        const falloff = (dist - 28) / 13;
        h = THREE.MathUtils.lerp(h, -2.8, Math.min(1.0, falloff * falloff));
      }

      return h;
    }

      const pearl = new THREE.Mesh(pearlGeo, pearlMat);

    // Procedural 3D Palm Trees (elevated onto hills and dunes)
    function createPalmTree(x, z, scale = 1.0, curveAngle = 0.2) {
      const treeGroup = new THREE.Group();
      const baseHeight = getTerrainHeight(x, z);
      treeGroup.position.set(x, baseHeight, z);

      // Curved Trunk
      const trunkMat = new THREE.MeshStandardMaterial({ map: barkTexture, roughness: 0.85 });
      const trunkSegments = 7;
      let prevPart = treeGroup;
      const segmentHeight = 1.1 * scale;

      for (let i = 0; i < trunkSegments; i++) {
        const rTop = (0.35 - i * 0.02) * scale;
        const rBottom = (0.42 - i * 0.02) * scale;
        const segGeo = new THREE.CylinderGeometry(rTop, rBottom, segmentHeight, 8);
        const segMesh = new THREE.Mesh(segGeo, trunkMat);
        segMesh.castShadow = true;
        segMesh.receiveShadow = true;
        segMesh.position.y = segmentHeight / 2;

        const pivot = new THREE.Group();
        pivot.position.y = (i === 0 ? 0 : segmentHeight);
        pivot.rotation.z = Math.sin(curveAngle + i * 0.15) * 0.08;
        pivot.rotation.x = Math.cos(curveAngle + i * 0.15) * 0.05;
        pivot.add(segMesh);

        prevPart.add(pivot);
        prevPart = pivot;
      }

      // Palm Crown & Fronds
      const crown = new THREE.Group();
      crown.position.y = segmentHeight;
      prevPart.add(crown);

      // Coconuts
      const coconutMat = new THREE.MeshStandardMaterial({ color: 0x4a2e16, roughness: 0.8 });
      for (let c = 0; c < 3; c++) {
        const cMesh = new THREE.Mesh(new THREE.SphereGeometry(0.25 * scale, 6, 6), coconutMat);
        const cAngle = (c / 3) * Math.PI * 2;
        cMesh.position.set(Math.cos(cAngle) * 0.3 * scale, -0.15 * scale, Math.sin(cAngle) * 0.3 * scale);
        crown.add(cMesh);
      }

      // Arching Palm Fronds
      const leafMat = new THREE.MeshStandardMaterial({
        map: leafTexture,
        side: THREE.DoubleSide,
        roughness: 0.6,
        metalness: 0.1
      });
      const numFronds = 9;
      for (let f = 0; f < numFronds; f++) {
        const frondAngle = (f / numFronds) * Math.PI * 2;
        const frondPivot = new THREE.Group();
        frondPivot.rotation.y = frondAngle;

        const leafGeo = new THREE.PlaneGeometry(0.9 * scale, 3.8 * scale, 3, 8);
        // Arch the leaf downward
        const pos = leafGeo.attributes.position;
        for (let p = 0; p < pos.count; p++) {
          const yVal = pos.getY(p);
          const arch = Math.pow((yVal + 1.9 * scale) / (3.8 * scale), 2) * -1.2 * scale;
          pos.setZ(p, arch);
        }
        leafGeo.computeVertexNormals();

        const leafMesh = new THREE.Mesh(leafGeo, leafMat);
        leafMesh.position.set(0, 0, 1.8 * scale);
        leafMesh.rotation.x = -Math.PI / 2.3;
        leafMesh.castShadow = true;
        frondPivot.add(leafMesh);
        crown.add(frondPivot);
      }

      scene.add(treeGroup);
    }

    // Place Palm Trees around dunes and coastal hills

    function spawnBlackFlashShockwave(originPos, scale = 1.0) {
      const ring1 = new THREE.Mesh(shockwaveGeo, shockwaveMat.clone());
      ring1.position.copy(originPos);
      ring1.rotation.x = Math.PI / 2;
      shockwaveGroup.add(ring1);

      const ring2 = new THREE.Mesh(shockwaveGeo, new THREE.MeshBasicMaterial({ color: 0x050608, transparent: true, opacity: 0.9 }));
      ring2.position.copy(originPos);
      ring2.rotation.x = Math.PI / 2;

      shockwaveGroup.add(ring2);

      activeShockwaves.push({
        mesh: ring1,
        life: 0.45,
        maxLife: 0.45,
        growth: 28 * scale

    const lightningMaterials = [
      new THREE.LineBasicMaterial({ color: 0x020204, linewidth: 3 }),

    const activeLightning = [];

    function spawnBlackFlashLightning(originPos, scale = 1.0) {
      spawnBlackFlashShockwave(originPos, scale);

      for (let i = 0; i < 11; i++) {
        const points = [];
        let curr = originPos.clone();
        points.push(curr.clone());

        const dir = new THREE.Vector3(
          (Math.random() - 0.5) * 2,
          (Math.random() - 0.2) * 2,
          (Math.random() - 0.5) * 2
        ).normalize();

        const segments = 8 + Math.floor(Math.random() * 5);
        const stepDist = (0.9 + Math.random() * 0.9) * scale;

        for (let s = 0; s < segments; s++) {
          curr.add(dir.clone().multiplyScalar(stepDist));
          curr.x += (Math.random() - 0.5) * 1.3 * scale;
          curr.y += (Math.random() - 0.5) * 1.3 * scale;
          curr.z += (Math.random() - 0.5) * 1.3 * scale;
          points.push(curr.clone());
        }

        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = lightningMaterials[i % lightningMaterials.length];
        const line = new THREE.Line(geo, mat);
        lightningGroup.add(line);

        activeLightning.push({
          mesh: line,
          life: 0.25 + Math.random() * 0.16,
          maxLife: 0.41
        });
      }
    }

    function spawnDebris(pos, intensity = 14) {

        chunk.position.copy(pos);
        chunk.position.y = Math.max(0.1, chunk.position.y);

    const speedCanvas = document.getElementById('speed-lines-canvas');

    function renderSpeedLines() {
      if (!speedCtx || !speedLinesActive) return;
      const w = speedCanvas.width;
      const h = speedCanvas.height;
      speedCtx.clearRect(0, 0, w, h);

      const cx = w / 2;
      const cy = h / 2;
      const numLines = 36;
      speedCtx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
      speedCtx.lineWidth = 2.5;

      for (let i = 0; i < numLines; i++) {
        const angle = Math.random() * Math.PI * 2;
        const innerR = Math.min(w, h) * (0.28 + Math.random() * 0.1);
        const outerR = Math.max(w, h) * 0.75;
        const x1 = cx + Math.cos(angle) * innerR;
        const y1 = cy + Math.sin(angle) * innerR;
        const x2 = cx + Math.cos(angle) * outerR;
        const y2 = cy + Math.sin(angle) * outerR;

        speedCtx.beginPath();
        speedCtx.moveTo(x1, y1);
        speedCtx.lineTo(x2, y2);
        speedCtx.stroke();
      }
    }

    function updateAwakeningUI() {
      const bar = document.getElementById('awakening-bar');
      const pctText = document.getElementById('awakening-pct');
      const awakenBtn = document.getElementById('btn-awaken');
      const awakenLabel = document.getElementById('label-awaken');
      const awakenSub = document.getElementById('sub-awaken');

      if (!bar || !pctText || !awakenBtn) return;

      if (state.player.inZone) {
        const timeFraction = Math.max(0, state.player.zoneTimer / 30.0);
        const timePct = timeFraction * 100;
        bar.style.width = timePct + '%';
        bar.className = 'h-full bg-gradient-to-r from-red-600 to-amber-400 rounded-full transition-all duration-75 shadow-[0_0_10px_#ef4444]';
        pctText.innerText = `${state.player.zoneTimer.toFixed(1)}s`;
        if (awakenSub) awakenSub.innerText = `${state.player.zoneTimer.toFixed(1)}s`;
      } else {
        const gauge = state.player.awakening;
        bar.style.width = gauge + '%';
        bar.className = 'h-full bg-gradient-to-r from-yellow-500 via-amber-400 to-red-500 rounded-full transition-all duration-100 shadow-[0_0_8px_#f59e0b]';
        pctText.innerText = `${Math.round(gauge)}%`;
        if (awakenSub) awakenSub.innerText = `${Math.round(gauge)}%`;

        if (gauge >= 100) {
          awakenBtn.classList.remove('opacity-40', 'cursor-not-allowed');
          awakenBtn.classList.add('ult-ready-anim');
          if (awakenLabel) {
            awakenLabel.innerText = 'AWAKEN';

          awakenBtn.classList.remove('ult-ready-anim', 'ult-active-anim');

          }
        }
      }
    }

      const bR = document.getElementById('reticle-bracket-r');

      if (state.shiftLock) {

        try {
          if (document.body.requestPointerLock && !('ontouchstart' in window)) {
            document.body.requestPointerLock();

        if (btn) {
          btn.innerText = 'LOCK ON';
          btn.parentElement.classList.add('border-cyan-400', 'shadow-[0_0_10px_#00f0ff]');
        }
        if (crosshair) crosshair.classList.add('shift-lock-active');
        if (bL) bL.classList.remove('hidden');
        if (bR) bR.classList.remove('hidden');
        showHitBanner("SHIFT LOCK: ENABLED");
      } else {
        document.body.classList.remove('shift-lock-cursor-hidden');
        try {
          if (document.exitPointerLock && document.pointerLockElement) {
            document.exitPointerLock();
          }
        } catch (e) {}

        if (btn) {
          btn.innerText = 'LOCK OFF';
          btn.parentElement.classList.remove('border-cyan-400', 'shadow-[0_0_10px_#00f0ff]');
        }
        if (crosshair) crosshair.classList.remove('shift-lock-active');
        if (bL) bL.classList.add('hidden');
        if (bR) bR.classList.add('hidden');
        showHitBanner("SHIFT LOCK: DISABLED");
      }
    }

      bannerText.innerText = text;

    function applyDamageToDummy(dmg, hitType, isUnblockable = false) {
      if (state.dummy.isDead) return false;

      // KNOCKDOWN PROTECTION: Downed enemies laying flat on the floor cannot be hit!
      if (state.dummy.state === 'RAGDOLL' || state.dummy.isHeadInGround) {
        showHitBanner("OPPONENT IS DOWNED! (INVULNERABLE)");
        return false;
      }

      // Behind check: Guard only protects frontal arc. Behind attacks break block!
      const victimFacing = new THREE.Vector3(Math.sin(state.dummy.rotY), 0, Math.cos(state.dummy.rotY)).normalize();
      const toAttacker = yuji.root.position.clone().sub(dummy.root.position).setY(0).normalize();
      const dot = victimFacing.dot(toAttacker);
      const isFromBehind = dot < -0.2; // Attacker is behind victim

      if (state.dummy.isBlocking && !isUnblockable) {
        if (isFromBehind) {
          // Block Broken!
          state.dummy.isBlocking = false;
          state.dummy.stunTimer = 0.9;
          triggerAnimeImpactFrame();
          triggerScreenShake(0.35);
          showHitBanner("GUARD BROKEN FROM BEHIND! CRITICAL HIT!");
        } else {
          // Blocked: 0 DMG, 0 Ult gained, no stun!
          playPunchSound(false);
          triggerScreenShake(0.08);
          showHitBanner("BLOCKED! 0 DMG (0 ULT)");
          return false;
        }
      }

      // Unblocked or broken hit
      state.dummy.hp = Math.max(0, state.dummy.hp - dmg);
      updateEnemyUI();
      state.dummy.stunTimer = 0.7; // 0.7s hitstun
      state.dummy.isBlocking = false;

      const pushDir = dummy.root.position.clone().sub(yuji.root.position);
      pushDir.y = 0;
      pushDir.normalize();

      if (hitType === 'FAR_LAUNCH') {
        state.dummy.state = 'RAGDOLL';
        state.dummy.ragdollTimer = 1.6;
        state.dummy.vel.copy(pushDir.multiplyScalar(44));
        state.dummy.vel.y = 11;
      } else if (hitType === 'BLACK_FLASH_LAUNCH') {
        state.dummy.state = 'RAGDOLL';
        state.dummy.ragdollTimer = 1.1;
        state.dummy.vel.copy(pushDir.multiplyScalar(15));
        state.dummy.vel.y = 3.2;
      } else if (hitType === 'DOWN_SLAM') {
        state.dummy.state = 'RAGDOLL';
        state.dummy.ragdollTimer = 1.5; // Lays down for 1.5s (INVULNERABLE)
        state.dummy.vel.set(0, 0, 0);   // Stop movement immediately
        dummy.root.position.y = 0;      // Snap directly to the floor instantly
        dummy.pelvis.position.y = 0.22;
        dummy.pelvis.rotation.set(-Math.PI / 2, 0, 0);
      } else if (hitType === 'DROPKICK_LAUNCH') {
        state.dummy.state = 'LAUNCHED_BACK';
        state.dummy.ragdollTimer = 1.4;
        state.dummy.vel.copy(pushDir.multiplyScalar(38));
        state.dummy.vel.y = 9;
      } else {
        state.dummy.vel.add(pushDir.multiplyScalar(6));
      }

      if (state.dummy.hp <= 0) {
        triggerDummyDeath(hitType === 'BLACK_FLASH_LAUNCH' || hitType === 'FAR_LAUNCH');
      }

      return true;
    }

    function triggerDummyDeath(explodeWithBlackFlash = false) {

    function updateDummyAI(dt) {
      if (state.dummy.isDead) {
        state.dummy.respawnTimer -= dt;
        if (state.dummy.respawnTimer <= 0) {
          respawnDummy();
        }
        return;
      }

      if (state.dummy.stunTimer > 0) {
        state.dummy.stunTimer -= dt;
        return;
      }
      if (state.dummy.state === 'RAGDOLL' || state.dummy.state === 'LAUNCHED_BACK') {
        state.dummy.ragdollTimer -= dt;
        // Fix: Removed the restrictive 'y <= 0.05' check so fighters get up anywhere on sand hills/dunes
        if (state.dummy.ragdollTimer <= 0) {
          state.dummy.state = 'IDLE';
          state.dummy.isHeadInGround = false;
          dummy.pelvis.position.y = 1.6;
          dummy.pelvis.rotation.set(0, 0, 0);
          dummy.torso.rotation.set(0, 0, 0);
          dummy.head.rotation.set(0, 0, 0);
          dummy.head.position.set(0, 0.33, 0);
          dummy.leftLegPivot.rotation.set(0, 0, 0);
          dummy.rightLegPivot.rotation.set(0, 0, 0);
          dummy.leftArmPivot.rotation.set(0, 0, 0);
          dummy.rightArmPivot.rotation.set(0, 0, 0);
          dummy.leftElbow.rotation.set(0, 0, 0);
          dummy.rightElbow.rotation.set(0, 0, 0);
          dummy.leftKnee.rotation.set(0, 0, 0);
          dummy.rightKnee.rotation.set(0, 0, 0);
        }
        return;
      }

      if (state.dummy.attackTimer > 0) {
        state.dummy.attackTimer -= dt;
        if (state.dummy.attackTimer <= 0) {
          state.dummy.state = 'IDLE';
        }
      }

      const toPlayer = yuji.root.position.clone().sub(dummy.root.position);
      const dist = toPlayer.length();
      toPlayer.y = 0;
      toPlayer.normalize();

      state.dummy.rotY = Math.atan2(toPlayer.x, toPlayer.z);
      dummy.root.rotation.y = state.dummy.rotY;

      if (state.dummy.mode === 'SANDBAG') {
        state.dummy.isBlocking = false;
        return;
      }

      state.dummy.timer -= dt;
      if (state.dummy.mode === 'DEFENSIVE') {
        state.dummy.isBlocking = true;
      } else if (state.dummy.mode === 'AGGRESSIVE') {
        state.dummy.isBlocking = false;

        if (dist > 3.2 && state.dummy.state !== 'ATTACKING') {
          state.dummy.vel.x += toPlayer.x * 9.5 * dt * 8;
          state.dummy.vel.z += toPlayer.z * 9.5 * dt * 8;
          state.dummy.walkCycle += dt * 14;
        }

        if (dist <= 3.8 && state.dummy.timer <= 0 && state.dummy.state !== 'ATTACKING' && !state.player.isDead) {
          state.dummy.timer = 1.1 + Math.random() * 0.9;
          state.dummy.state = 'ATTACKING';
          state.dummy.attackPhase = (state.dummy.attackPhase % 2) + 1;
          state.dummy.attackDuration = 0.42;
          state.dummy.attackTimer = 0.42;

          setTimeout(() => {
            const currentDist = yuji.root.position.distanceTo(dummy.root.position);
            if (currentDist < 4.2 && state.player.state !== 'CINEMATIC' && !state.player.isDead) {
              if (state.player.isBlocking) {
                playPunchSound(false);
                triggerScreenShake(0.12);
                showHitBanner("PLAYER BLOCKED ATTACK!");
                addAwakeningGauge(3);
              } else {
                playPunchSound(true);
                state.player.hp = Math.max(0, state.player.hp - 12);
                updatePlayerUI();
                triggerScreenShake(0.35);
                spawnDebris(yuji.root.position, 6);
                addAwakeningGauge(6);
                showHitBanner("MAHITO SOUL STRIKE!");
                if (state.player.hp <= 0) triggerPlayerDeath();
              }
            }
          }, 180);
        }
      }
    }

    function executeJump() {
      if (state.player.state !== 'IDLE' && state.player.state !== 'ATTACKING') return;
      if (state.player.isAirborne || state.cinematic.active || state.player.isDead) return;

      state.player.isAirborne = true;
      const jumpPower = Math.max(4.0, 9.2 - state.player.jumpFatigueCount * 1.8);
      state.player.vel.y = jumpPower;
      state.player.jumpFatigueCount++;
      state.player.jumpFatigueTimer = 1.5;

      playDodgeSound();

      if (state.player.m1Step >= 3) {
        state.player.hasDownslamReady = true;
        showHitBanner("DOWNSLAM PRIMED IN AIR!");
      }
    }

    function executeM1() {
      if (state.player.isDead || state.player.isBlocking || state.cinematic.active) return;
      if (state.player.m1Lockout > 0) {
        showHitBanner(`M1 RECOVERING: ${state.player.m1Lockout.toFixed(1)}s`);
        return;
      }
      if (state.cooldowns.m1Delay > 0) {
        return;
      }
      if (state.player.state !== 'IDLE' && state.player.state !== 'ATTACKING') return;

      const now = performance.now();
      if (now - state.player.lastM1Time > 900) {
        state.player.m1Step = 0;
      }

      // Check for Aerial Jump Downslam
      if (state.player.isAirborne && state.player.hasDownslamReady) {
        state.player.hasDownslamReady = false;
        state.player.m1Step = 0;
        state.player.m1Lockout = 1.5;
        state.cooldowns.m1Delay = 0.5;
        updateM1Dots(0);

        state.player.state = 'ATTACKING';
        state.player.currentMove = 'DOWNSLAM_FINISHER';
        state.player.actionDuration = 0.5;
        state.player.actionTimer = 0.5;
        state.player.vel.y = -35;

        const d = yuji.root.position.distanceTo(dummy.root.position);
        if (d < 5.8) {
          triggerAnimeImpactFrame();
          triggerScreenShake(0.7);
          spawnDebris(dummy.root.position, 18);
          playPunchSound(true);
          const cleanHit = applyDamageToDummy(14, 'DOWN_SLAM', false);
          if (cleanHit) addAwakeningGauge(8);
          showHitBanner("AERIAL DOWNSLAM FINISHER!!");
        }
        return;
      }

      state.player.m1Step = (state.player.m1Step % 4) + 1;
      state.player.lastM1Time = now;
      state.cooldowns.m1Delay = 0.5; // Strict 0.5s cadence delay between each M1
      updateM1Dots(state.player.m1Step);

      const isHeavy = (state.player.m1Step === 4);
      if (isHeavy) {
        state.player.m1Lockout = 1.5; // 1.5s combo lockout after 4th M1
      }

      state.player.state = 'ATTACKING';
      state.player.currentMove = 'M1';
      state.player.actionDuration = 0.32;
      state.player.actionTimer = 0.32;

      if (!state.shiftLock) {
        const toDummy = dummy.root.position.clone().sub(yuji.root.position);
        toDummy.y = 0;
        if (toDummy.length() < 7) {
          state.player.rotY = Math.atan2(toDummy.x, toDummy.z);
        }
      }

      const forward = new THREE.Vector3(Math.sin(state.player.rotY), 0, Math.cos(state.player.rotY));
      state.player.vel.add(forward.multiplyScalar(6.5));

      playPunchSound(isHeavy);

      const dist = yuji.root.position.distanceTo(dummy.root.position);
      if (dist < 4.5) {
        // Prevent hitting downed enemies laying on the ground
        if (state.dummy.state === 'RAGDOLL' || state.dummy.isHeadInGround) {
          showHitBanner("CANNOT M1 DOWNED ENEMY!");
          return;
        }

        triggerScreenShake(isHeavy ? 0.38 : 0.16);
        spawnDebris(dummy.root.position, isHeavy ? 12 : 5);
        const dmg = isHeavy ? 12 : 4;
        const cleanHit = applyDamageToDummy(dmg, isHeavy ? 'FAR_LAUNCH' : 'NORMAL', false);
        if (cleanHit) addAwakeningGauge(isHeavy ? 6 : 3);
        showHitBanner(isHeavy ? "4TH HIT KNOCKBACK! (1.5s RECOVERY)" : `PUNCH ${state.player.m1Step}`);
      }
    }

    // Move 1: Divergent Fist (6s CD / 7 DMG) / Ult: Soul Dismantle (8s CD / 15 DMG)
    function triggerMove1() {
      if (state.player.isDead || state.player.state !== 'IDLE' || state.cinematic.active) return;
      if (state.cooldowns.skill1 > 0) return;

      state.player.state = 'ATTACKING';

      if (!state.shiftLock) {
        const toDummy = dummy.root.position.clone().sub(yuji.root.position);
        toDummy.y = 0;
        state.player.rotY = Math.atan2(toDummy.x, toDummy.z);
      }
      const forward = new THREE.Vector3(Math.sin(state.player.rotY), 0, Math.cos(state.player.rotY));

      if (state.player.inZone) {
        state.cooldowns.skill1 = 8.0;
        state.player.actionDuration = 0.55;
        state.player.actionTimer = 0.55;
        state.player.currentMove = 'SOUL_DISMANTLE';
        state.player.vel.add(forward.multiplyScalar(22));
        if (slashSynth) slashSynth.triggerAttackRelease('16n');

        const d = yuji.root.position.distanceTo(dummy.root.position);
        if (d < 5.8) {
          triggerAnimeImpactFrame();
          triggerScreenShake(0.65);
          spawnDebris(dummy.root.position, 14);
          applyDamageToDummy(15, 'SOUL_DISMANTLE', true);
          showHitBanner("SOUL DISMANTLE SLASH (15 DMG)!");
        }
      } else {
        state.cooldowns.skill1 = 6.0;
        state.player.actionDuration = 0.45;
        state.player.actionTimer = 0.45;
        state.player.currentMove = 'DIVERGENT';
        state.player.vel.add(forward.multiplyScalar(15));
        playPunchSound(false);

        const d = yuji.root.position.distanceTo(dummy.root.position);
        if (d < 5.0) {
          const isFinisherTarget = (state.dummy.hp < 15);
          const cleanHit = applyDamageToDummy(7, 'NORMAL', false);

          if (cleanHit) {
            addAwakeningGauge(8);
            showHitBanner("DIVERGENT STRIKE (7 DMG)!");

            if (isFinisherTarget) {
              state.player.state = 'ATTACKING';
              state.player.currentMove = 'DOWNSLAM_FINISHER';
              state.player.actionDuration = 0.95;
              state.player.actionTimer = 0.95;

              state.player.vel.set(0, 16, 0);
              state.dummy.vel.set(0, 16, 0);

              setTimeout(() => {
                state.player.vel.set(0, -30, 0);
                state.dummy.vel.set(0, -32, 0);
                playPunchSound(true);
                triggerAnimeImpactFrame();
                triggerScreenShake(0.9);
                spawnDebris(dummy.root.position, 22);
                applyDamageToDummy(10, 'DOWN_SLAM', true);
                state.dummy.isHeadInGround = true;
                showHitBanner("HEAD-IN-GROUND DOWNSLAM FINISHER!!");
              }, 340);
            }
          }
        }
      }
    }

    // Move 2: Manji Kick (7s CD / 9 DMG) / Ult: Piercing Blood (8s CD / 15 DMG)
    function triggerMove2() {
      if (state.player.isDead || state.player.state !== 'IDLE' || state.cinematic.active) return;
      if (state.cooldowns.skill2 > 0) return;

      state.player.state = 'ATTACKING';

      if (!state.shiftLock) {
        const toDummy = dummy.root.position.clone().sub(yuji.root.position);
        toDummy.y = 0;
        state.player.rotY = Math.atan2(toDummy.x, toDummy.z);
      }
      const forward = new THREE.Vector3(Math.sin(state.player.rotY), 0, Math.cos(state.player.rotY));

      if (state.player.inZone) {
        state.cooldowns.skill2 = 8.0;
        state.player.actionDuration = 0.6;
        state.player.actionTimer = 0.6;
        state.player.currentMove = 'PIERCING_BLOOD';
        state.player.vel.set(0, 0, 0);

        bloodBeam.visible = true;
        bloodBeam.position.copy(yuji.root.position).add(new THREE.Vector3(0, 1.4, 0));
        bloodBeam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), forward);
        bloodBeam.material.opacity = 1;
        triggerScreenShake(0.5);
        if (lightningNoise) lightningNoise.triggerAttackRelease('16n');

        setTimeout(() => {
          bloodBeam.material.opacity = 0;
          bloodBeam.visible = false;
        }, 120);

        const d = yuji.root.position.distanceTo(dummy.root.position);
        if (d < 24) {
          applyDamageToDummy(15, 'NORMAL', true);
          spawnDebris(dummy.root.position, 12);
          showHitBanner("PIERCING BLOOD (15 DMG)!");
        }
      } else {
        state.cooldowns.skill2 = 7.0;
        state.player.actionDuration = 0.62;
        state.player.actionTimer = 0.62;
        state.player.currentMove = 'MANJI';
        state.player.vel.add(forward.multiplyScalar(15));
        playPunchSound(true);

        const d = yuji.root.position.distanceTo(dummy.root.position);
        if (d < 5.2) {
          const isFinisherTarget = (state.dummy.hp < 15);
          triggerScreenShake(0.48);
          spawnDebris(dummy.root.position, 14);
          applyDamageToDummy(9, isFinisherTarget ? 'FAR_LAUNCH' : 'NORMAL', true);
          addAwakeningGauge(9);
          showHitBanner(isFinisherTarget ? "MANJI KICK AERIAL FINISHER!!" : "MANJI KICK (9 DMG)!");
        }
      }
    }

    // Move 3: Cursed Dropkick (11s CD / 15 DMG) / Ult: Cleave Rush (8s CD / 15 DMG)
    function triggerMove3() {
      if (state.player.isDead || state.player.state !== 'IDLE' || state.cinematic.active) return;
      if (state.cooldowns.skill3 > 0) return;

      state.player.state = 'ATTACKING';
      state.player.actionDuration = 0.65;
      state.player.actionTimer = 0.65;

      if (!state.shiftLock) {
        const toDummy = dummy.root.position.clone().sub(yuji.root.position);
        toDummy.y = 0;
        state.player.rotY = Math.atan2(toDummy.x, toDummy.z);

      if (state.player.inZone) {
        state.cooldowns.skill3 = 8.0;
        state.player.currentMove = 'CLEAVE_RUSH';

        if (d < 6.0) {

      } else {

        state.player.currentMove = 'DROPKICK';

        const d = yuji.root.position.distanceTo(dummy.root.position);
        if (d < 5.8) {

          spawnDebris(dummy.root.position, 18);
          applyDamageToDummy(15, isFinisherTarget ? 'FAR_LAUNCH' : 'DROPKICK_LAUNCH', true);
          addAwakeningGauge(12);
          showHitBanner(isFinisherTarget ? "CURSED DROPKICK SUPER-FINISHER!!" : "CURSED DROPKICK (15 DMG)!");
        }
      }
    }

    // Move 4: Black Flash (10 DMG, strict 1s chain) / Ult: 8x Barrage (35s CD / 4 DMG x 8)
    function triggerMove4() {
      if (state.player.isDead || state.cinematic.active) return;

      const isChaining = (state.player.chainWindowTimer > 0);
      if (!isChaining && state.player.state !== 'IDLE') return;
      if (!isChaining && state.cooldowns.skill4 > 0) return;

      state.player.state = 'ATTACKING';
      state.player.actionDuration = 0.55;
      state.player.actionTimer = 0.55;

      if (!state.shiftLock) {
        const toDummy = dummy.root.position.clone().sub(yuji.root.position);
        toDummy.y = 0;
        state.player.rotY = Math.atan2(toDummy.x, toDummy.z);
      }
      const forward = new THREE.Vector3(Math.sin(state.player.rotY), 0, Math.cos(state.player.rotY));

      if (state.player.inZone) {
        state.cooldowns.skill4 = 35.0;
        state.player.currentMove = 'BARRAGE';
        state.player.vel.add(forward.multiplyScalar(18));

        let hitCount = 0;
        const barrageInterval = setInterval(() => {
          if (state.player.isDead || state.dummy.isDead) {
            clearInterval(barrageInterval);
            return;
          }
          hitCount++;
          state.player.blackFlashStreak++;
          playBlackFlashSound(hitCount);
          triggerScreenShake(0.3 + hitCount * 0.08);
          spawnBlackFlashLightning(dummy.root.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 1.1 + hitCount * 0.1);
          applyDamageToDummy(4, 'NORMAL', true);
          updateBlackFlashStreakUI(state.player.blackFlashStreak);

          if (hitCount >= 8) {
            clearInterval(barrageInterval);
            triggerAnimeImpactFrame();
            triggerScreenShake(1.3);
            applyDamageToDummy(4, 'BLACK_FLASH_LAUNCH', true);
            state.player.chainWindowTimer = 1.0;
            showChainIndicator(true, 1.0);
            showHitBanner("8x KOKUSEN BARRAGE COMPLETE (4 DMG x 8)!");
          }
        }, 90);
      } else {
        state.player.currentMove = 'BLACK_FLASH';
        state.player.vel.add(forward.multiplyScalar(22));

        const d = yuji.root.position.distanceTo(dummy.root.position);
        if (d < 3.4) {
          const isFinisherTarget = (state.dummy.hp < 15);
          state.player.blackFlashStreak++;
          const streak = state.player.blackFlashStreak;

          playBlackFlashSound(streak);
          triggerAnimeImpactFrame();
          state.hitstop = 0.1;
          triggerScreenShake(0.7 + streak * 0.16);

          const hitPos = dummy.root.position.clone().add(new THREE.Vector3(0, 1.3, 0));
          spawnBlackFlashLightning(hitPos, 1.2 + streak * 0.22);
          spawnDebris(dummy.root.position, 18);

          const cleanHit = applyDamageToDummy(10, 'BLACK_FLASH_LAUNCH', false);

          if (cleanHit) {
            addAwakeningGauge(16);
            updateBlackFlashStreakUI(streak);

            if (isFinisherTarget) {
              showHitBanner("KOKUSEN COLLAPSE FINISHER!!");
            }

            state.player.chainWindowTimer = 1.0;
            showChainIndicator(true, 1.0);
            showHitBanner(`KOKUSEN #${streak}! (1.0s CHAIN ACTIVE)`);
          } else {
            resetBlackFlashStreak();
            state.cooldowns.skill4 = 5.0;
          }
        } else {
          showHitBanner("BLACK FLASH MISSED (CHAIN LOST)!");
          resetBlackFlashStreak();
          state.cooldowns.skill4 = 5.0;
        }
      }
    }

    function executeDash() {
      if (state.player.isDead || state.cinematic.active) return;
      if (state.player.state !== 'IDLE' && state.player.state !== 'DASHING') return;
      if (state.cooldowns.dash > 0) return;

      state.cooldowns.dash = 0.9;
      state.player.state = 'DASHING';
      state.player.actionDuration = 0.38;
      state.player.actionTimer = 0.38;

      if (keys['KeyS'] || keys['ArrowDown']) {
        state.player.dashDirection = 'BACK';
      } else if (keys['KeyA'] || keys['ArrowLeft']) {
        state.player.dashDirection = 'LEFT';
      } else if (keys['KeyD'] || keys['ArrowRight']) {
        state.player.dashDirection = 'RIGHT';
      } else {
        state.player.dashDirection = 'FORWARD';
      }

      let moveDir = getMovementInputVector();
      if (moveDir.lengthSq() < 0.1) {
        moveDir = new THREE.Vector3(Math.sin(state.player.rotY), 0, Math.cos(state.player.rotY));
      }

      state.player.vel.copy(moveDir.multiplyScalar(82));
      state.player.vel.y = 8.5;
      playDodgeSound();
      triggerScreenShake(0.24);
    }

    function getMovementInputVector() {
      const v = new THREE.Vector3();
      const forward = new THREE.Vector3(-Math.sin(state.camera.yaw), 0, -Math.cos(state.camera.yaw));
      const right = new THREE.Vector3(Math.cos(state.camera.yaw), 0, -Math.sin(state.camera.yaw));

      if (keys['KeyW'] || keys['ArrowUp']) v.add(forward);
      if (keys['KeyS'] || keys['ArrowDown']) v.sub(forward);
      if (keys['KeyD'] || keys['ArrowRight']) v.add(right);
      if (keys['KeyA'] || keys['ArrowLeft']) v.sub(right);

      if (v.lengthSq() > 0) v.normalize();
      return v;
    }

    const keys = {};
    let isMouseDown = false;
    let isRightMouseDown = false;
    let isLeftDragging = false;
    let mouseStartPos = { x: 0, y: 0 };
    let lastMousePos = { x: 0, y: 0 };

    window.addEventListener('keydown', (e) => {
      initAudio();
      keys[e.code] = true;

      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'KeyZ') {
        toggleShiftLock();
      }

      if (e.code === 'Space') {
        executeJump();
      }

      if (state.cinematic.active || state.player.isDead) return;

      if (e.code === 'Digit1') triggerMove1();
      if (e.code === 'Digit2') triggerMove2();
      if (e.code === 'Digit3') triggerMove3();
      if (e.code === 'Digit4') triggerMove4();
      if (e.code === 'KeyQ') executeDash();
      if (e.code === 'KeyF') {
        state.player.isBlocking = true;
        const tag = document.getElementById('player-state-text');
        if (tag) tag.innerText = 'GUARDING';
      }
      if (e.code === 'KeyG') {
        tryActivateTheZone();
      }
      if (e.code === 'KeyR') respawnDummy();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
      if (e.code === 'KeyF') {
        state.player.isBlocking = false;
        const tag = document.getElementById('player-state-text');
        if (tag) tag.innerText = 'READY';
      }
    });

    let lookTouchId = null;
    let lastTouchLookPos = { x: 0, y: 0 };

    window.addEventListener('touchstart', (e) => {
      initAudio();
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        
        if (el && (el.closest('button') || el.closest('#mobile-controls'))) {
          continue;
        }

        if (lookTouchId === null) {
          lookTouchId = touch.identifier;
          lastTouchLookPos = { x: touch.clientX, y: touch.clientY };
          break;
        }
      }
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (lookTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        const touch = e.changedTouches[i];
        if (touch.identifier === lookTouchId) {
          const dx = touch.clientX - lastTouchLookPos.x;
          const dy = touch.clientY - lastTouchLookPos.y;

          state.camera.yaw -= dx * 0.007;
          state.camera.pitch = Math.max(-0.25, Math.min(1.25, state.camera.pitch + dy * 0.006));

          lastTouchLookPos = { x: touch.clientX, y: touch.clientY };
          break;
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (lookTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === lookTouchId) {
          lookTouchId = null;
          break;
        }
      }
    });

    window.addEventListener('touchcancel', () => {
      lookTouchId = null;
    });

    window.addEventListener('mousedown', (e) => {
      initAudio();
      if (e.target.closest('button') || e.target.closest('#mobile-controls')) return;

      lastMousePos = { x: e.clientX, y: e.clientY };
      mouseStartPos = { x: e.clientX, y: e.clientY };

      if (e.button === 0) {
        isMouseDown = true;
        isLeftDragging = false;
      } else if (e.button === 2) {
        isRightMouseDown = true;
      }
    });

    window.addEventListener('mouseup', (e) => {
      if (e.button === 0) {
        const distMoved = Math.hypot(e.clientX - mouseStartPos.x, e.clientY - mouseStartPos.y);
        if (!isLeftDragging && distMoved < 6 && !state.cinematic.active && !state.player.isDead) {
          if (state.player.chainWindowTimer > 0) {
            triggerMove4();
          } else {
            executeM1();
          }
        }
        isMouseDown = false;
        isLeftDragging = false;
      }
      if (e.button === 2) isRightMouseDown = false;
    });

    window.addEventListener('mousemove', (e) => {
      const movementX = (document.pointerLockElement) ? e.movementX : (e.clientX - lastMousePos.x);
      const movementY = (document.pointerLockElement) ? e.movementY : (e.clientY - lastMousePos.y);

      if (isMouseDown) {
        const totalDist = Math.hypot(e.clientX - mouseStartPos.x, e.clientY - mouseStartPos.y);
        if (totalDist > 5) {
          isLeftDragging = true;
        }
      }

      if (state.shiftLock || isRightMouseDown || (isMouseDown && isLeftDragging)) {
        state.camera.yaw -= movementX * 0.005;
        state.camera.pitch = Math.max(-0.25, Math.min(1.25, state.camera.pitch + movementY * 0.005));
      }

      lastMousePos = { x: e.clientX, y: e.clientY };
    });

    // PC Mouse Wheel Camera Zoom
    window.addEventListener('wheel', (e) => {
      if (state.cinematic.active) return;
      state.camera.dist = Math.max(3.5, Math.min(22.0, state.camera.dist + e.deltaY * 0.012));
    }, { passive: true });

    window.addEventListener('contextmenu', (e) => e.preventDefault());

    document.getElementById('btn-m1').addEventListener('click', () => {
      if (state.cinematic.active || state.player.isDead) return;
      initAudio();
      if (state.player.chainWindowTimer > 0) triggerMove4();
      else executeM1();
    });
    document.getElementById('btn-skill-1').addEventListener('click', () => { if (!state.cinematic.active && !state.player.isDead) { initAudio(); triggerMove1(); } });
    document.getElementById('btn-skill-2').addEventListener('click', () => { if (!state.cinematic.active && !state.player.isDead) { initAudio(); triggerMove2(); } });
    document.getElementById('btn-skill-3').addEventListener('click', () => { if (!state.cinematic.active && !state.player.isDead) { initAudio(); triggerMove3(); } });
    document.getElementById('btn-skill-4').addEventListener('click', () => { if (!state.cinematic.active && !state.player.isDead) { initAudio(); triggerMove4(); } });
    document.getElementById('btn-dash').addEventListener('click', () => { if (!state.cinematic.active && !state.player.isDead) { initAudio(); executeDash(); } });
    document.getElementById('btn-jump').addEventListener('click', () => { if (!state.cinematic.active && !state.player.isDead) { initAudio(); executeJump(); } });
    document.getElementById('btn-shiftlock').addEventListener('click', toggleShiftLock);

    document.getElementById('btn-block').addEventListener('mousedown', () => { if (!state.cinematic.active && !state.player.isDead) state.player.isBlocking = true; });
    document.getElementById('btn-block').addEventListener('mouseup', () => { state.player.isBlocking = false; });
    document.getElementById('btn-block').addEventListener('touchstart', (e) => { e.preventDefault(); if (!state.cinematic.active && !state.player.isDead) state.player.isBlocking = true; });
    document.getElementById('btn-block').addEventListener('touchend', (e) => { e.preventDefault(); state.player.isBlocking = false; });
    document.getElementById('btn-awaken').addEventListener('click', () => { initAudio(); tryActivateTheZone(); });

    document.getElementById('btn-dummy-mode').addEventListener('click', () => {
      const modes = ['SANDBAG', 'DEFENSIVE', 'AGGRESSIVE'];
      const next = modes[(modes.indexOf(state.dummy.mode) + 1) % modes.length];
      state.dummy.mode = next;
      const t = document.getElementById('dummy-mode-text');

      if (next === 'SANDBAG') {
        if (t) { t.innerText = 'SANDBAG'; t.className = 'text-green-400 font-black'; }
        showHitBanner("AI: PRACTICE SANDBAG MODE");
      } else if (next === 'DEFENSIVE') {
        if (t) { t.innerText = 'DEFENSIVE'; t.className = 'text-yellow-400 font-black'; }
        showHitBanner("AI: DEFENSIVE BLOCK MODE");
      } else {
        if (t) { t.innerText = 'AGGRESSIVE'; t.className = 'text-red-400 font-black'; }
        showHitBanner("AI: AGGRESSIVE PVP MODE");
      }
    });

    document.getElementById('btn-reset-dummy').addEventListener('click', respawnDummy);

    let soundEnabled = true;
    document.getElementById('btn-sound').addEventListener('click', () => {
      initAudio();
      soundEnabled = !soundEnabled;
      if (window.Tone && Tone.Destination) {
        Tone.Destination.mute = !soundEnabled;
      }
      const icon = document.getElementById('sound-icon');
      if (icon) icon.innerText = soundEnabled ? '🔊' : '🔇';
    });

    // Touch Virtual Joystick
    const joystick = document.getElementById('mobile-controls');
    const knob = document.getElementById('joystick-knob');
    let joystickTouchId = null;
    let joystickCenter = { x: 0, y: 0 };
    let joystickVector = { x: 0, y: 0 };

    joystick.addEventListener('touchstart', (e) => {
      e.stopPropagation();
      initAudio();
      const touch = e.changedTouches[0];
      joystickTouchId = touch.identifier;
      const rect = joystick.getBoundingClientRect();
      joystickCenter = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
      handleJoystickMove(touch.clientX, touch.clientY);
    }, { passive: false });

    window.addEventListener('touchmove', (e) => {
      if (joystickTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          handleJoystickMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
          break;
        }
      }
    }, { passive: false });

    window.addEventListener('touchend', (e) => {
      if (joystickTouchId === null) return;
      for (let i = 0; i < e.changedTouches.length; i++) {
        if (e.changedTouches[i].identifier === joystickTouchId) {
          joystickTouchId = null;
          joystickVector = { x: 0, y: 0 };
          knob.style.transform = `translate(0px, 0px)`;
          break;
        }
      }
    });

    function handleJoystickMove(clientX, clientY) {
      const dx = clientX - joystickCenter.x;
      const dy = clientY - joystickCenter.y;
      const maxRadius = 24;
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      const clampedDist = Math.min(dist, maxRadius);

      const kx = Math.cos(angle) * clampedDist;
      const ky = Math.sin(angle) * clampedDist;
      knob.style.transform = `translate(${kx}px, ${ky}px)`;

      joystickVector = {
        x: kx / maxRadius,
        y: ky / maxRadius
      };
    }

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const rawDt = clock.getDelta();
      const dt = Math.min(rawDt, 0.05);
      const time = clock.getElapsedTime();

      // Dynamic Animated Ocean Waves
      const posAttr = waterGeo.attributes.position;
      for (let i = 0; i < posAttr.count; i++) {
        const u = posAttr.getX(i);
        const v = posAttr.getY(i);
        const wave1 = Math.sin(u * 0.12 + time * 2.2) * 0.32;
        const wave2 = Math.cos(v * 0.09 + time * 1.8) * 0.26;
        const wave3 = Math.sin((u + v) * 0.07 + time * 3.1) * 0.16;
        posAttr.setZ(i, waterBaseZ[i] + wave1 + wave2 + wave3);
      }
      posAttr.needsUpdate = true;
      waterGeo.computeVertexNormals();

      if (state.hitstop > 0) {
        state.hitstop -= dt;
        renderer.render(scene, camera);
        return;
      }

      if (state.player.isDead) {
        state.player.respawnTimer -= dt;
        if (state.player.respawnTimer <= 0) {
          respawnPlayer();
        }
      }

      if (state.player.m1Step > 0 && performance.now() - state.player.lastM1Time > 900) {
        state.player.m1Step = 0;
        updateM1Dots(0);
      }

      if (state.player.jumpFatigueTimer > 0) {
        state.player.jumpFatigueTimer -= dt;
        if (state.player.jumpFatigueTimer <= 0) {
          state.player.jumpFatigueCount = 0;
        }
      }

      if (state.player.m1Lockout > 0) {
        state.player.m1Lockout -= dt;
      }
      if (state.cooldowns.m1Delay > 0) {
        state.cooldowns.m1Delay -= dt;
      }

      // 6-Second Awakening Cinematic Cutscene
      if (state.cinematic.active) {
        state.cinematic.timer -= dt;
        state.cinematic.heartbeatTimer -= dt;

        if (state.cinematic.heartbeatTimer <= 0) {
          state.cinematic.heartbeatTimer = Math.max(0.24, state.cinematic.timer * 0.14);
          if (heartbeatSynth) heartbeatSynth.triggerAttackRelease('C1', '8n');
          triggerScreenShake(0.25);
          spawnBlackFlashLightning(yuji.root.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 0.9);
        }

        const elapsed = 6.0 - state.cinematic.timer;
        const subTitle = document.getElementById('cinematic-sub-text');

        state.camera.dist = 7.5;

        yuji.torso.rotation.set(0, 0, 0);
        yuji.pelvis.rotation.set(0, 0, 0);
        yuji.leftArmPivot.rotation.set(0, 0, 0);
        yuji.rightArmPivot.rotation.set(0, 0, 0);
        yuji.leftLegPivot.rotation.set(0, 0, 0);
        yuji.rightLegPivot.rotation.set(0, 0, 0);

        if (elapsed < 2.0) {
          if (subTitle) subTitle.innerText = "SOUL COMPRESSION";

          yuji.torso.rotation.x = 0.45;
