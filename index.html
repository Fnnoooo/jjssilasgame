          yuji.leftArmPivot.rotation.x = -Math.PI / 3;
          yuji.leftArmPivot.rotation.z = 0.2;
        } else if (elapsed < 4.6) {
          if (subTitle) subTitle.innerText = "120% POTENTIAL IGNITION!";
          const violentTremor = (Math.random() - 0.5) * 0.35;
          const headTremor = (Math.random() - 0.5) * 0.24;
          
          triggerScreenShake(0.32);
          yuji.pelvis.position.y = 1.45 + (Math.random() - 0.5) * 0.07;
          yuji.torso.rotation.x = -0.3 + violentTremor * 0.6;
          yuji.torso.rotation.z = violentTremor * 0.5;
          yuji.head.rotation.x = -0.65 + headTremor;
          yuji.head.rotation.y = headTremor * 0.8;

          yuji.rightArmPivot.rotation.x = -Math.PI / 2.2 + violentTremor;
          yuji.rightArmPivot.rotation.z = 0.6 + violentTremor;
          yuji.leftArmPivot.rotation.x = -Math.PI / 2.2 - violentTremor;
          yuji.leftArmPivot.rotation.z = -0.6 - violentTremor;

          yuji.leftLegPivot.rotation.x = -0.35;
          yuji.rightLegPivot.rotation.x = 0.35;

          if (Math.random() > 0.45) {
            spawnBlackFlashShockwave(yuji.root.position.clone().add(new THREE.Vector3(0, 1.2, 0)), 1.1);
          }
          if (Math.random() > 0.6) {
            spawnBlackFlashLightning(yuji.root.position.clone().add(new THREE.Vector3(0, 1.3, 0)), 1.4);
          }
        } else {
          if (subTitle) subTitle.innerText = "THE ESSENCE UNLEASHED!";
          const roarShake = (Math.random() - 0.5) * 0.16;
          yuji.pelvis.position.y = 1.25;
          yuji.torso.rotation.x = 0.4 + roarShake;
          yuji.torso.rotation.y = -0.25;
          yuji.head.rotation.x = -0.5;
          yuji.rightArmPivot.rotation.x = -Math.PI / 1.4;
          yuji.rightArmPivot.rotation.y = 0.35;
          yuji.leftArmPivot.rotation.x = 0.4;
          yuji.leftLegPivot.rotation.x = -0.65;
          yuji.rightLegPivot.rotation.x = 0.55;

          if (Math.random() > 0.3) {
            spawnBlackFlashLightning(yuji.root.position.clone().add(new THREE.Vector3(0, 1.4, 0)), 2.0);
          }
        }

        if (state.cinematic.timer <= 0) {
          completeCinematicAwakening();
        }

        const camDist = 7.5;
        const camTarget = yuji.root.position.clone().add(state.camera.targetOffset);

        const cx = camTarget.x + Math.sin(state.camera.yaw) * Math.cos(state.camera.pitch) * camDist;
        const cy = camTarget.y + Math.sin(state.camera.pitch) * camDist;
        const cz = camTarget.z + Math.cos(state.camera.yaw) * Math.cos(state.camera.pitch) * camDist;

        camera.position.set(cx, cy, cz);
        if (state.camera.shake > 0) {
          state.camera.shake = Math.max(0, state.camera.shake - dt * 2.8);
          camera.position.x += (Math.random() - 0.5) * state.camera.shake;
          camera.position.y += (Math.random() - 0.5) * state.camera.shake;
          camera.position.z += (Math.random() - 0.5) * state.camera.shake;
        }
        camera.lookAt(camTarget);

        renderer.render(scene, camera);
        return;
      }

      if (state.player.chainWindowTimer > 0) {
        state.player.chainWindowTimer -= dt;
        showChainIndicator(true, state.player.chainWindowTimer);
        if (state.player.chainWindowTimer <= 0) {
          showChainIndicator(false);
          if (!state.player.inZone) {
            resetBlackFlashStreak();
            state.cooldowns.skill4 = 5.0;
          }
        }
      }

      if (state.player.inZone) {
        state.player.zoneTimer -= dt;
        updateAwakeningUI();
        if (state.player.zoneTimer <= 0) {
          deactivateTheZone();
        }
      }

      for (const k in state.cooldowns) {
        if (state.cooldowns[k] > 0) {
          state.cooldowns[k] -= dt;
          const cdEl = document.getElementById(`cd-${k.replace('skill', '')}`);
          if (cdEl) {
            if (state.cooldowns[k] > 0.05) {
              cdEl.classList.remove('hidden');
              cdEl.innerText = state.cooldowns[k].toFixed(1);
            } else {
              cdEl.classList.add('hidden');
            }
          }
        }
      }

      if (state.player.actionTimer > 0) {
        state.player.actionTimer -= dt;
        if (state.player.actionTimer <= 0 && state.player.state !== 'IDLE') {
          state.player.state = 'IDLE';
          state.player.currentMove = null;
        }
      }

      let moveDir = getMovementInputVector();
      if (joystickTouchId !== null) {
        const joyForward = new THREE.Vector3(-Math.sin(state.camera.yaw), 0, -Math.cos(state.camera.yaw));
        const joyRight = new THREE.Vector3(Math.cos(state.camera.yaw), 0, -Math.sin(state.camera.yaw));
        moveDir = joyForward.multiplyScalar(-joystickVector.y).add(joyRight.multiplyScalar(joystickVector.x));
        if (moveDir.lengthSq() > 1) moveDir.normalize();
      }

      if (state.shiftLock) {
        const desiredRot = state.camera.yaw + Math.PI;
        let diff = desiredRot - state.player.rotY;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        state.player.rotY += diff * 0.45;
      }

      if (!state.player.isDead && state.player.state === 'IDLE' && moveDir.lengthSq() > 0.01) {
        const guardMultiplier = state.player.isBlocking ? 0.42 : 1.0;
        const speed = state.player.speed * guardMultiplier * (state.player.inZone ? 1.35 : 1.0);
        state.player.vel.x += moveDir.x * speed * dt * 10;
        state.player.vel.z += moveDir.z * speed * dt * 10;

        if (!state.shiftLock) {
          const targetRot = Math.atan2(moveDir.x, moveDir.z);
          let diff = targetRot - state.player.rotY;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          state.player.rotY += diff * 0.25;
        }
      }

      state.player.vel.x *= 0.82;
      state.player.vel.z *= 0.82;
      state.player.vel.y -= 22 * dt;
      yuji.root.position.addScaledVector(state.player.vel, dt);

      const playerTerrainY = getTerrainHeight(yuji.root.position.x, yuji.root.position.z);
      if (yuji.root.position.y <= playerTerrainY) {
        yuji.root.position.y = playerTerrainY;
        state.player.vel.y = 0;
        if (state.player.isAirborne) {
          state.player.isAirborne = false;
          state.player.hasDownslamReady = false;
        }
      }

      // Island Boundary Clamping (Soft beach perimeter)
      const beachLimit = islandRadius - 2.5;
      const pDist = Math.hypot(yuji.root.position.x, yuji.root.position.z);
      if (pDist > beachLimit) {
        const pAngle = Math.atan2(yuji.root.position.z, yuji.root.position.x);
        yuji.root.position.x = Math.cos(pAngle) * beachLimit;
        yuji.root.position.z = Math.sin(pAngle) * beachLimit;
      }
      yuji.root.rotation.y = state.player.rotY;

      state.dummy.vel.x *= 0.88;
      state.dummy.vel.z *= 0.88;
      state.dummy.vel.y -= 25 * dt;
      dummy.root.position.addScaledVector(state.dummy.vel, dt);

      const dummyTerrainY = getTerrainHeight(dummy.root.position.x, dummy.root.position.z);
      if (dummy.root.position.y <= dummyTerrainY) {
        dummy.root.position.y = dummyTerrainY;
        state.dummy.vel.y = 0;
      }

      // Shoreline boundary bounce for dummy
      const dDist = Math.hypot(dummy.root.position.x, dummy.root.position.z);
      if (dDist > beachLimit) {
        const dAngle = Math.atan2(dummy.root.position.z, dummy.root.position.x);
        dummy.root.position.x = Math.cos(dAngle) * beachLimit;
        dummy.root.position.z = Math.sin(dAngle) * beachLimit;
        if (state.dummy.vel.length() > 12) {
          playPunchSound(true);
          triggerScreenShake(0.42);
          spawnDebris(dummy.root.position, 16);

          state.dummy.vel.z *= -0.7;

      dummy.torso.rotation.set(0, 0, 0);
      dummy.pelvis.rotation.set(0, 0, 0);
      dummy.leftArmPivot.rotation.set(0, 0, 0);
      dummy.rightArmPivot.rotation.set(0, 0, 0);
      dummy.leftLegPivot.rotation.set(0, 0, 0);
      dummy.rightLegPivot.rotation.set(0, 0, 0);
      dummy.leftElbow.rotation.set(0, 0, 0);

        dummy.rightArmPivot.rotation.set(0, 0, -0.5);

        dummy.rightKnee.rotation.set(-0.3, 0, 0);

      } else if (state.dummy.state === 'LAUNCHED_BACK') {

        dummy.rightLegPivot.rotation.x = -0.8;
      } else if (state.dummy.stunTimer > 0) {
        dummy.torso.rotation.x = 0.4;
        dummy.head.rotation.x = 0.5;
        dummy.leftArmPivot.rotation.x = 0.3;
        dummy.rightArmPivot.rotation.x = 0.3;
      } else if (state.dummy.state === 'RAGDOLL') {
        dummy.pelvis.position.y = 0.22;
        dummy.pelvis.rotation.x = -Math.PI / 2;
        dummy.torso.rotation.set(0, 0, 0);
        dummy.head.rotation.set(-0.2, 0, 0);
        dummy.leftLegPivot.rotation.set(0, 0, 0.1);

      } else if (state.dummy.state === 'ATTACKING') {
        if (state.dummy.attackPhase === 1) {
          dummy.rightArmPivot.rotation.x = -Math.PI / 1.4;

        dummy.leftKnee.rotation.x = Math.max(0, -Math.sin(dWalk) * 0.65);
        dummy.rightKnee.rotation.x = Math.max(0, Math.sin(dWalk) * 0.65);
        dummy.leftArmPivot.rotation.x = -Math.sin(dWalk) * 0.7;

        dummy.torso.rotation.x = 0.25;
      } else {
        dummy.pelvis.position.y = 1.6 + Math.sin(clock.getElapsedTime() * 2.5) * 0.03;
        dummy.torso.rotation.y = Math.sin(clock.getElapsedTime() * 1.5) * 0.08;

      const isMoving = (state.player.vel.lengthSq() > 1.2);

      const animProgress = state.player.actionDuration > 0 ? (1 - (state.player.actionTimer / state.player.actionDuration)) : 0;

          yuji.aura.material.opacity = 0;

      } else if (state.player.state === 'ATTACKING') {

        if (move === 'DOWNSLAM_FINISHER') {
          yuji.pelvis.position.y = 1.1;

          yuji.leftArmPivot.rotation.x = -Math.PI / 1.05;
          yuji.rightElbow.rotation.x = -0.3;
          yuji.leftElbow.rotation.x = -0.3;
        } else if (move === 'M1') {

            yuji.leftArmPivot.rotation.y = 0.12;

            yuji.rightArmPivot.rotation.y = -0.28;
            yuji.rightElbow.rotation.x = -0.7;
            yuji.leftLegPivot.rotation.x = -0.36;
            yuji.rightLegPivot.rotation.x = 0.32;
            yuji.leftKnee.rotation.x = -0.2;
          } else if (step === 2) {

            yuji.torso.rotation.y = -0.68;
            yuji.torso.rotation.x = 0.24;
            yuji.rightArmPivot.rotation.x = -Math.PI / 1.62;
            yuji.rightArmPivot.rotation.y = -0.16;
            yuji.rightElbow.rotation.x = -0.12;

            yuji.leftElbow.rotation.x = -0.65;
            yuji.rightLegPivot.rotation.x = -0.46;
            yuji.leftLegPivot.rotation.x = 0.42;
            yuji.rightKnee.rotation.x = -0.3;
          } else if (step === 3) {

            yuji.torso.rotation.x = -0.18;
            yuji.torso.rotation.z = -0.68;
            yuji.rightLegPivot.rotation.x = -Math.PI / 2.0;
            yuji.rightLegPivot.rotation.z = 0.98;
            yuji.rightKnee.rotation.x = -0.25;
            yuji.leftArmPivot.rotation.z = -0.62;
            yuji.rightArmPivot.rotation.z = 0.62;
          } else {
            yuji.pelvis.position.y = 1.18;
            yuji.torso.rotation.x = 0.78;
            yuji.rightArmPivot.rotation.x = -Math.PI / 1.12;
            yuji.leftArmPivot.rotation.x = -Math.PI / 1.12;
            yuji.rightArmPivot.rotation.z = -0.22;
            yuji.leftArmPivot.rotation.z = 0.22;
            yuji.rightElbow.rotation.x = -0.25;
            yuji.leftElbow.rotation.x = -0.25;
            yuji.leftLegPivot.rotation.x = -0.48;
            yuji.rightLegPivot.rotation.x = 0.48;
            yuji.leftKnee.rotation.x = -0.35;
            yuji.rightKnee.rotation.x = -0.35;
          }
        } else if (move === 'DIVERGENT') {
          if (animProgress < 0.38) {
            yuji.pelvis.position.y = 1.25;
            yuji.torso.rotation.y = -0.75;
            yuji.torso.rotation.x = 0.35;
            yuji.rightArmPivot.rotation.x = 0.7;
            yuji.rightArmPivot.rotation.y = -0.55;

            yuji.leftLegPivot.rotation.x = -0.65;
            yuji.rightLegPivot.rotation.x = 0.55;

            yuji.rightArmPivot.rotation.x = -Math.PI / 1.55;
            yuji.rightArmPivot.rotation.y = 0.25;
            yuji.rightElbow.rotation.x = -0.15;
            yuji.leftArmPivot.rotation.x = 0.4;
            yuji.leftLegPivot.rotation.x = 0.55;

        } else if (move === 'MANJI') {
          if (animProgress < 0.48) {

            yuji.torso.rotation.x = 0.65;

            yuji.rightLegPivot.rotation.x = 0.4;
            yuji.rightArmPivot.rotation.x = 0.8;
            yuji.leftArmPivot.rotation.x = 0.8;

        } else if (move === 'DROPKICK') {

          yuji.torso.rotation.x = -Math.PI / 2.05;

          yuji.leftArmPivot.rotation.z = -0.4;
          yuji.rightArmPivot.rotation.z = 0.4;
        } else if (move === 'BLACK_FLASH') {
          if (animProgress < 0.35) {
            yuji.pelvis.position.y = 1.1;

            yuji.rightArmPivot.rotation.x = 0.75;

            yuji.leftLegPivot.rotation.x = -0.7;

          } else {

            yuji.torso.rotation.x = 0.45;

            yuji.rightArmPivot.rotation.x = -Math.PI / 1.45;

          yuji.rightArmPivot.rotation.x = -Math.PI / 1.9;
          yuji.rightArmPivot.rotation.y = -0.42;
          yuji.leftElbow.rotation.x = -0.3;
          yuji.rightElbow.rotation.x = -0.3;
        } else if (move === 'CLEAVE_RUSH' || move === 'BARRAGE') {
          const flurry = Math.sin(clock.getElapsedTime() * 34);
          yuji.torso.rotation.y = flurry * 0.45;
          yuji.leftArmPivot.rotation.x = -Math.PI / 2 + flurry * 0.65;
          yuji.rightArmPivot.rotation.x = -Math.PI / 2 - flurry * 0.65;
          yuji.leftElbow.rotation.x = -0.35;
          yuji.rightElbow.rotation.x = -0.35;
        }
      } else if (state.player.isBlocking) {
        yuji.rightArmPivot.rotation.x = -Math.PI / 2.0;
        yuji.leftArmPivot.rotation.x = -Math.PI / 2.0;
        yuji.rightArmPivot.rotation.y = -0.45;
        yuji.leftArmPivot.rotation.y = 0.45;
        yuji.rightElbow.rotation.x = -0.65;
        yuji.leftElbow.rotation.x = -0.65;
        yuji.torso.rotation.x = 0.2;
      } else if (state.player.state === 'DASHING') {
        const dir = state.player.dashDirection;
        if (dir === 'BACK') {
          yuji.pelvis.position.y = 1.8;
          yuji.torso.rotation.x = -0.45;
          yuji.leftArmPivot.rotation.x = -0.7;
          yuji.rightArmPivot.rotation.x = -0.7;
          yuji.leftLegPivot.rotation.x = 0.6;
          yuji.rightLegPivot.rotation.x = -0.4;
        } else if (dir === 'LEFT') {
          yuji.pelvis.position.y = 1.7;
          yuji.torso.rotation.z = 0.55;
          yuji.leftArmPivot.rotation.z = -0.8;
          yuji.rightArmPivot.rotation.z = -0.3;
          yuji.leftLegPivot.rotation.z = 0.4;
        } else if (dir === 'RIGHT') {
          yuji.pelvis.position.y = 1.7;
          yuji.torso.rotation.z = -0.55;
          yuji.rightArmPivot.rotation.z = 0.8;
          yuji.leftArmPivot.rotation.z = 0.3;
          yuji.rightLegPivot.rotation.z = -0.4;
        } else {
          yuji.pelvis.position.y = 1.9;
          yuji.torso.rotation.x = 0.85;
          yuji.leftArmPivot.rotation.x = 1.2;
          yuji.rightArmPivot.rotation.x = 1.2;
          yuji.leftLegPivot.rotation.x = -0.8;
          yuji.rightLegPivot.rotation.x = -0.8;
          yuji.leftKnee.rotation.x = -0.9;
          yuji.rightKnee.rotation.x = -0.9;
        }
      } else if (state.player.isAirborne) {
        yuji.pelvis.position.y = 1.7;
        yuji.torso.rotation.x = 0.15;
        yuji.leftLegPivot.rotation.x = -0.4;
        yuji.rightLegPivot.rotation.x = 0.4;
        yuji.leftKnee.rotation.x = -0.6;
        yuji.rightKnee.rotation.x = -0.6;
        yuji.leftArmPivot.rotation.x = -0.4;
        yuji.rightArmPivot.rotation.x = -0.4;
      } else if (isMoving) {
        yuji.torso.rotation.x = 0.28;
        yuji.leftLegPivot.rotation.x = Math.sin(walkTime) * 0.88;
        yuji.rightLegPivot.rotation.x = -Math.sin(walkTime) * 0.88;
        yuji.leftKnee.rotation.x = Math.max(0, -Math.sin(walkTime) * 0.75);
        yuji.rightKnee.rotation.x = Math.max(0, Math.sin(walkTime) * 0.75);

        yuji.leftArmPivot.rotation.x = -Math.sin(walkTime) * 0.82;
        yuji.rightArmPivot.rotation.x = Math.sin(walkTime) * 0.82;
        yuji.leftElbow.rotation.x = -0.35;
        yuji.rightElbow.rotation.x = -0.35;
      } else {
        const bounce = Math.sin(clock.getElapsedTime() * 3.2);
        yuji.pelvis.position.y = 1.6 + bounce * 0.04;
        yuji.torso.rotation.y = Math.sin(clock.getElapsedTime() * 1.6) * 0.06;
        yuji.torso.rotation.x = 0.08;

        yuji.leftArmPivot.rotation.x = THREE.MathUtils.lerp(yuji.leftArmPivot.rotation.x, -0.42, 0.2);
        yuji.leftArmPivot.rotation.y = 0.25;
        yuji.leftElbow.rotation.x = THREE.MathUtils.lerp(yuji.leftElbow.rotation.x, -0.65, 0.2);

        yuji.rightArmPivot.rotation.x = THREE.MathUtils.lerp(yuji.rightArmPivot.rotation.x, -0.42, 0.2);
        yuji.rightArmPivot.rotation.y = -0.25;
        yuji.rightElbow.rotation.x = THREE.MathUtils.lerp(yuji.rightElbow.rotation.x, -0.65, 0.2);

        yuji.leftLegPivot.rotation.x = -0.15;
        yuji.rightLegPivot.rotation.x = 0.15;
        yuji.leftKnee.rotation.x = -0.1;
        yuji.rightKnee.rotation.x = -0.1;
      }

      // Shockwave rings decay
      for (let i = activeShockwaves.length - 1; i >= 0; i--) {
        const sw = activeShockwaves[i];
        sw.life -= dt;
        const progress = 1 - (sw.life / sw.maxLife);
        const scaleVal = 1 + progress * sw.growth;
        sw.mesh.scale.set(scaleVal, scaleVal, scaleVal);
        sw.mesh.material.opacity = Math.max(0, (sw.life / sw.maxLife) * 0.95);

        if (sw.life <= 0) {
          shockwaveGroup.remove(sw.mesh);
          sw.mesh.geometry.dispose();
          sw.mesh.material.dispose();
          activeShockwaves.splice(i, 1);
        }
      }

      // Black Flash lightning decay
      for (let i = activeLightning.length - 1; i >= 0; i--) {
        const item = activeLightning[i];
        item.life -= dt;
        if (item.life <= 0) {
          lightningGroup.remove(item.mesh);
          item.mesh.geometry.dispose();
          activeLightning.splice(i, 1);
        } else {
          item.mesh.scale.multiplyScalar(1.02);
        }
      }

      // Arena Debris Physics
      for (let i = activeDebris.length - 1; i >= 0; i--) {
        const deb = activeDebris[i];
        deb.life -= dt;
        deb.vel.y -= 28 * dt;
        deb.mesh.position.addScaledVector(deb.vel, dt);
        deb.mesh.rotation.x += deb.rot.x * dt;
        deb.mesh.rotation.y += deb.rot.y * dt;

        if (deb.mesh.position.y <= 0.1) {
          deb.mesh.position.y = 0.1;
          deb.vel.y *= -0.4;
          deb.vel.x *= 0.7;
          deb.vel.z *= 0.7;
        }

        if (deb.life <= 0) {
          debrisGroup.remove(deb.mesh);
          deb.mesh.geometry.dispose();
          activeDebris.splice(i, 1);
        }
      }

      // Camera Orbit & Shift Lock Offset
      const camDist = state.camera.dist * (state.player.inZone ? 0.9 : 1.0);
      const camTarget = yuji.root.position.clone().add(state.camera.targetOffset);

      if (state.shiftLock) {
        const shoulderOffset = new THREE.Vector3(Math.cos(state.camera.yaw), 0, -Math.sin(state.camera.yaw)).multiplyScalar(1.2);
        camTarget.add(shoulderOffset);
      }

      const cx = camTarget.x + Math.sin(state.camera.yaw) * Math.cos(state.camera.pitch) * camDist;
      const cy = camTarget.y + Math.sin(state.camera.pitch) * camDist;
      const cz = camTarget.z + Math.cos(state.camera.yaw) * Math.cos(state.camera.pitch) * camDist;

      camera.position.set(cx, cy, cz);

      if (state.camera.shake > 0) {
        state.camera.shake = Math.max(0, state.camera.shake - dt * 2.8);
        camera.position.x += (Math.random() - 0.5) * state.camera.shake;
        camera.position.y += (Math.random() - 0.5) * state.camera.shake;
        camera.position.z += (Math.random() - 0.5) * state.camera.shake;
      }

      camera.lookAt(camTarget);

      renderer.render(scene, camera);
    }

    function handleResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      camera.aspect = width / height;
      camera.updateProjectionMatrix();

      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      if (speedCanvas) {
        speedCanvas.width = width;
        speedCanvas.height = height;
      }

      const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
      if (joystick) {
        joystick.style.display = isTouchDevice ? 'flex' : 'none';
      }
    }

    window.addEventListener('resize', handleResize);
    window.addEventListener('orientationchange', () => {
      setTimeout(handleResize, 100);
      setTimeout(handleResize, 300);
    });

    window.onload = function() {
      handleResize();
      updateHotbarLabels();
      updatePlayerUI();
      updateEnemyUI();
      updateAwakeningUI();
      animate();
    };
  </script>
</body>
</html>
